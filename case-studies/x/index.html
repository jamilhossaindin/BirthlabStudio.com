<script>
// Enforce immediate scroll-to-top on reload and disable browser auto-scroll restoration
try {
  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }
  window.scrollTo(0, 0);
  window.addEventListener('beforeunload', function() { window.scrollTo(0, 0); });
  window.addEventListener('pageshow', function() { window.scrollTo(0, 0); });
  window.addEventListener('load', function() {
    window.scrollTo(0, 0);
    setTimeout(function() { window.scrollTo(0, 0); }, 50);
    setTimeout(function() { window.scrollTo(0, 0); }, 200);
  });
} catch(e) {}

/** 🪞 Carbon-Copy Universal Interaction & Runtime Bridge **/
(function() {
  // 1. Telemetry & Analytics Stubs (prevent blocking errors)
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function() { window.dataLayer.push(arguments); };
  window.fbq = window.fbq || function() {};
  window.hj = window.hj || function() {};
  window.grecaptcha = {
    ready: function(cb) { if (cb) setTimeout(cb, 10); },
    execute: function() { return Promise.resolve('mock-token'); },
    render: function() { return 'mock-id'; },
    reset: function() {},
    getResponse: function() { return 'mock-token'; }
  };
  window.Sentry = { init: function() {}, captureException: function() {}, captureMessage: function() {} };

  // 2. Disable Service Workers that could hijack asset requests
  if ('serviceWorker' in navigator) {
    try {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
      navigator.serviceWorker.register = function() {
        return Promise.reject(new Error('ServiceWorker disabled in offline mirror'));
      };
    } catch(e) {}
  }

  // 3. Fetch & XHR Interceptor for local mirror compatibility
  var _fetch = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === 'string') {
      if (url.startsWith('/api/') || url.includes('/analytics') || url.includes('/telemetry')) {
        return Promise.resolve(new Response(JSON.stringify({ ok: true, status: 200, message: "Local Mirror Mock" }), {
          status: 200, headers: { 'Content-Type': 'application/json' }
        }));
      }
      if (url.startsWith('/') && !url.startsWith('/mirror/')) {
        var m = window.location.pathname.match(/\/mirror\/[^\/]+/);
        if (m) url = m[0] + url;
      }
    }
    return _fetch ? _fetch.call(this, url, opts) : Promise.resolve(new Response(''));
  };

  // 4. Wake up page & trigger layout recalculations
  function wakeUpPage() {
    try {
      document.documentElement.classList.remove('lenis-stopped');
      if (document.body) {
        if (document.body.style.overflow === 'hidden' && document.documentElement.classList.contains('portal-preloader-done')) {
          document.body.style.overflow = '';
        }
      }

      if (window.Webflow && window.Webflow.require) {
        var ix2 = window.Webflow.require('ix2');
        if (ix2 && ix2.init) ix2.init();
      }

      if (window.ScrollTrigger && window.ScrollTrigger.refresh) {
        window.ScrollTrigger.refresh();
      }

      window.scrollTo(0, 0);
      window.dispatchEvent(new Event('resize'));
    } catch(e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      wakeUpPage();
      setTimeout(wakeUpPage, 500);
      setTimeout(wakeUpPage, 1500);
    });
  } else {
    wakeUpPage();
    setTimeout(wakeUpPage, 500);
    setTimeout(wakeUpPage, 1500);
  }

  window.addEventListener('load', function() {
    wakeUpPage();
    setTimeout(wakeUpPage, 500);
  });

  // 5. Automatic Asset Sync & Live Hot-Swap Engine (Local Development)
  try {
    var isLocalEnv = window.location.hostname === 'localhost' ||
                     window.location.hostname === '127.0.0.1' ||
                     window.location.hostname === '0.0.0.0' ||
                     window.location.protocol === 'file:';

    if (isLocalEnv) {
      (function initLiveAssetSync() {
        var assetSignatures = new Map();
        var isPolling = false;

        function getTrackedElements() {
          var items = [];
          document.querySelectorAll('img[src], video[src], link[rel*="icon"]').forEach(function(el) {
            var src = el.getAttribute('src') || el.getAttribute('href');
            if (src && !src.startsWith('data:') && !src.startsWith('blob:') && !src.startsWith('http://') && !src.startsWith('https://')) {
              items.push({ el: el, rawSrc: src, cleanSrc: src.split('?')[0] });
            }
          });
          return items;
        }

        function checkAsset(item) {
          return new Promise(function(resolve) {
            fetch(item.cleanSrc, { method: 'HEAD', cache: 'no-cache' })
              .then(function(res) {
                if (!res.ok) return resolve();
                var sig = (res.headers.get('etag') || '') + '|' + (res.headers.get('content-length') || '') + '|' + (res.headers.get('last-modified') || '');
                var existing = assetSignatures.get(item.cleanSrc);
                if (existing === undefined) {
                  assetSignatures.set(item.cleanSrc, sig);
                } else if (existing !== sig && sig !== '||') {
                  console.log('[BirthLab Asset Sync] Detected updated asset:', item.cleanSrc);
                  assetSignatures.set(item.cleanSrc, sig);
                  var buster = '?t=' + Date.now();
                  var base = item.cleanSrc;
                  var tag = item.el.tagName;

                  if (tag === 'IMG') {
                    item.el.src = base + buster;
                    var origSrcset = item.el.getAttribute('srcset');
                    if (origSrcset) {
                      var updated = origSrcset.replace(new RegExp(base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\?t=\\d+)?', 'g'), base + buster);
                      item.el.setAttribute('srcset', updated);
                    }
                  } else if (tag === 'VIDEO') {
                    var cur = item.el.currentTime;
                    var playing = !item.el.paused;
                    item.el.src = base + buster;
                    item.el.load();
                    item.el.currentTime = cur;
                    if (playing) item.el.play().catch(function() {});
                  } else {
                    item.el.href = base + buster;
                  }
                }
                resolve();
              })
              .catch(function() { resolve(); });
          });
        }

        function poll() {
          if (isPolling) return;
          isPolling = true;
          var tracked = getTrackedElements();
          if (!tracked.length) { isPolling = false; return; }
          var promises = tracked.map(checkAsset);
          Promise.all(promises).then(function() { isPolling = false; }).catch(function() { isPolling = false; });
        }

        setTimeout(poll, 1000);
        setInterval(poll, 1500);
      })();
    }
  } catch(e) {}
})();
</script>
